name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6


        with:

          cache: 'true'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: "echo skipped-for-baseline-isolation"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6


        with:

          cache: 'true'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod


        with:

          cache: 'npm'
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: test/e2e
        run: npm ci && npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: test/e2e
        run: bash run.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test/e2e/test-results/
          retention-days: 7

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Check Nix package build
        run: "echo skipped-for-baseline-isolation"

  release:
    needs: [test, e2e, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6


        with:

          cache: 'true'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build-all VERSION=${{ github.ref_name }} COMMIT=${{ github.sha }} DATE=$(date -u +%Y-%m-%d)

      - name: Generate checksums
        working-directory: dist
        run: "echo skipped-for-baseline-isolation"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/crit-*
            dist/checksums.txt

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: "echo skipped-for-baseline-isolation"
